name: 調査
description: 一次情報と最小限の技術検証に基づく調査
title: "[R-xx] "
labels: ["research"]
body:
  - type: textarea
    id: scope
    attributes:
      label: 背景・目的・対象外
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依存 Issue
      description: 実際の Issue 番号を記載してください。
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 一次情報 URL
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: 具体的な手順と停止条件
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 成果物と受入基準
    validations:
      required: true
