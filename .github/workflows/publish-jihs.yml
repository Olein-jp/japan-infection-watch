name: JIHS 週次定点の数値版を公開

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 承認済みの候補検証の実行 ID
        type: string
        required: true

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    name: 承認と候補を照合して配布用一式を用意
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配布承認を照合
        id: approval
        shell: bash
        env:
          RUN_ID: ${{ inputs.candidate_run_id }}
          APPROVED_RELEASE: ${{ vars.JIHS_APPROVED_RELEASE }}
        run: |
          reviewed_inputs=$(python3 -B -m scripts.jihs_release_inputs)
          reviewed_weeks=$(jq -c 'keys' <<< "$reviewed_inputs")
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ || "$GITHUB_SHA" != "$(git rev-parse HEAD)" ]] ||
            ! jq -es --arg run_id "$RUN_ID" --arg revision "$GITHUB_SHA" --argjson weeks "$reviewed_weeks" '
              def sha256: type == "string" and length == 64 and test("^[0-9a-f]+$");
              (length == 1) and (.[0] |
                (.run_id == $run_id) and (.revision == $revision) and
                (.weeks == $weeks) and
                (.candidate_sha256 | sha256) and (.pages_sha256 | sha256))
            ' <<< "$APPROVED_RELEASE" >/dev/null 2>&1; then
            echo "::error::実行 ID、コミット、対象週と2つのハッシュを含む配布承認が必要です"
            exit 1
          fi
          {
            echo "candidate_sha256=$(jq -r .candidate_sha256 <<< "$APPROVED_RELEASE")"
            echo "pages_sha256=$(jq -r .pages_sha256 <<< "$APPROVED_RELEASE")"
          } >> "$GITHUB_OUTPUT"
      - name: 照合済み候補を取得して配布版を検証
        id: site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_SHA256: ${{ steps.approval.outputs.candidate_sha256 }}
          PAGES_SHA256: ${{ steps.approval.outputs.pages_sha256 }}
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/jihs-pages.XXXXXX")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$work/run.json"
          if ! jq -e --arg repository "$GITHUB_REPOSITORY" --arg branch "$DEFAULT_BRANCH" --arg revision "$GITHUB_SHA" '
            (.repository.full_name == $repository) and (.head_repository.full_name == $repository) and
            (.head_branch == $branch) and (.head_sha == $revision) and
            (.event == "workflow_dispatch") and (.conclusion == "success") and
            (.path == ".github/workflows/check-jihs-candidate.yml")
          ' "$work/run.json" >/dev/null; then
            echo "::error::承認したコミット上の候補検証の成功実行を指定してください"
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name jihs-candidate-reviewed-jihs --dir "$work"
          python3 -B -m scripts.prepare_jihs_pages "$work/artifact.tar" --output "$work/site" \
            --candidate-sha256 "$CANDIDATE_SHA256" --pages-sha256 "$PAGES_SHA256" > "$work/report.json"
          {
            echo '### Pages 配布用一式の検証結果'
            echo '```json'
            python3 -m json.tool "$work/report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "path=$work/site" >> "$GITHUB_OUTPUT"
      - name: 配布用成果物をアップロード
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.path }}
          retention-days: 1

  deploy:
    name: GitHub Pages へ配布
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
