name: 公式リンク先行版を公開

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    name: 公開ファイルを用意
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 公開対象のファイルを配置
        id: site
        shell: bash
        run: |
          site_dir="$(mktemp -d "$RUNNER_TEMP/official-links.XXXXXX")"
          install -m 0644 apps/web/official_links/index.html apps/web/official_links/404.html apps/web/assets/site.css "$site_dir"
          (cd "$site_dir" && openssl dgst -sha256 index.html 404.html site.css)
          echo "path=$site_dir" >> "$GITHUB_OUTPUT"
      - name: 配布用成果物をアップロード
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.path }}
          retention-days: 1

  deploy:
    name: GitHub Pages へ配布
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
