<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>感染症動向ウォッチ</title>
<meta name="description" content="感染症の週報や学校での流行状況を、提供元の公式サイトで確認できます。">
<link rel="stylesheet" href="site.css">
</head>
<body>
<main class="shell">
  <header class="page-title hero">
    <h1>感染症動向ウォッチ</h1>
    <p>感染症の流行状況を確認できる公式情報を案内します。</p>
  </header>
  <section class="panel" aria-labelledby="weekly">
    <h2 id="weekly">全国・都道府県の週次報告</h2>
    <p>感染症別の報告数や定点当たり報告数を確認できます。</p>
    <p><a href="https://id-info.jihs.go.jp/surveillance/idwr/provisional/sokuhou.html">国立健康危機管理研究機構（JIHS）の感染症発生動向調査週報・速報</a></p>
  </section>
  <section class="panel" aria-labelledby="school">
    <h2 id="school">学校の欠席・学級閉鎖</h2>
    <p>学校等の欠席、出席停止や学級閉鎖の状況を確認できます。</p>
    <p><a href="https://www.gakkohoken.jp/system_information/jssh_absence_information_mapping">日本学校保健会の感染症情報マップ</a></p>
  </section>
</main>
</body>
</html>
